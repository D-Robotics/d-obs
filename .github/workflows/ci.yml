name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dobs_test
          POSTGRES_PASSWORD: dobs_test
          POSTGRES_DB: dobs_arch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dobs_test -d dobs_arch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Tool and plugin regressions
        run: node --import tsx --test tools/*.test.mjs tools/*.test.mts plugins/rdk-camera-workshop/mcp/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical fixture dependency
        run: python3 -m pip install 'numpy>=1.24,<3'
      - name: Python camera and release controller regressions
        run: |
          set -eu
          for test_file in tools/*.test.py .codex/skills/d-obs-release/scripts/paired-release-controller.test.py; do
            python3 -B "$test_file"
          done
      - name: PostgreSQL persistence and worker lease integration
        env:
          DOBS_TEST_DATABASE_URL: postgresql://dobs_test:dobs_test@127.0.0.1:5432/dobs_arch_test
        run: >-
          node --import tsx --test
          server/monitoring/worker-lease-pg.integration.test.ts
          server/monitoring/dashboard-boards-pg.integration.test.ts
          server/public-api/public-observability-pg.integration.test.ts
          server/observability/ai-ecosystem-metrics-pg.integration.test.ts
          server/monitoring/platform-assistant-confirm-pg.integration.test.ts
      - run: npm run build
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Deployment preflight
        env:
          RDK_ALERT_STATE_PATH: ${{ runner.temp }}/d-obs-state.json
        run: npm run doctor
      - name: TypeScript test coverage smoke
        run: node --import tsx --test --experimental-test-coverage "server/**/*.test.ts"
      # 冒烟：无数据库环境也能正常启动并响应（优雅降级契约）。
      - name: Boot smoke test (no database)
        run: |
          set -eu
          npx tsx server/main.ts > /tmp/d-obs-ci-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:47110/healthz > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:47110/healthz | grep -q '"ok":true'
          ready_status="$(curl -sS -o /tmp/d-obs-ci-ready.json -w '%{http_code}' http://127.0.0.1:47110/readyz)"
          case "$ready_status" in
            200|503) ;;
            *) echo "unexpected /readyz status: $ready_status"; cat /tmp/d-obs-ci-ready.json; exit 1 ;;
          esac
          grep -Eq '"status":"(ready|degraded)"|"reason":"database_not_configured"' /tmp/d-obs-ci-ready.json
          curl -fsS http://127.0.0.1:47110/api/v1/ecosystem/capabilities | grep -q 'capabilities'
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:47110/api/v1/observability/runs)" = "401"
          curl -sf -o /dev/null http://127.0.0.1:47110/ops-observability
