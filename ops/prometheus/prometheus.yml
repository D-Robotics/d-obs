global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Prometheus remains the low-latency query and alerting surface. Every sample
# is also written to the replicated VictoriaMetrics cluster; the local WAL
# buffers the remote write while the storage plane is rolling or unavailable.
remote_write:
  - url: http://127.0.0.1:8480/insert/0/prometheus/api/v1/write
    send_exemplars: true
    queue_config:
      capacity: 10000
      max_shards: 8
      min_shards: 1
      max_samples_per_send: 2000
      batch_send_deadline: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: d-obs
    static_configs:
      - targets: ['127.0.0.1:18093']
        labels:
          plane: cloud
          signal_source: d-obs
          platform: cloud
    metrics_path: /metrics
    scrape_timeout: 10s

  # Edge device identity/heartbeat/latest-sample metrics are a separate data
  # domain even though the registry lives in the cloud-side d-obs process.
  - job_name: edge
    static_configs:
      - targets: ['127.0.0.1:18093']
        labels:
          plane: edge
          signal_source: edge-agent
          platform: robot
    metrics_path: /edge-metrics
    scrape_timeout: 10s

  # Linux host health for the RDK Studio server. The exporter is bound to
  # localhost and is only reachable by this Prometheus instance.
  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9100']
        labels:
          plane: cloud
          signal_source: host
          platform: server
    scrape_timeout: 10s

  # The existing RDK Studio OTLP gateway exposes its own queue/exporter
  # health on localhost:8888. Keeping it in the same Prometheus gives one
  # query surface for application, collector and host health.
  - job_name: rdkstudio-otelcol
    static_configs:
      - targets: ['127.0.0.1:8888']
        labels:
          plane: cloud
          signal_source: collector
          platform: cloud
    scrape_timeout: 10s

  # VictoriaMetrics cluster health. These are cloud-side infrastructure
  # signals and are intentionally kept in Prometheus too.
  - job_name: vmstorage-a
    static_configs:
      - targets: ['127.0.0.1:8482']
        labels:
          plane: cloud
          signal_source: metrics-storage
          platform: storage
          replica: a
    scrape_timeout: 10s

  - job_name: vmstorage-b
    static_configs:
      - targets: ['127.0.0.1:8483']
        labels:
          plane: cloud
          signal_source: metrics-storage
          platform: storage
          replica: b
    scrape_timeout: 10s

  - job_name: vmstorage-c
    static_configs:
      - targets: ['127.0.0.1:8490']
        labels:
          plane: cloud
          signal_source: metrics-storage
          platform: storage
          replica: c
    scrape_timeout: 10s

  - job_name: vminsert
    static_configs:
      - targets: ['127.0.0.1:8484']
        labels:
          plane: cloud
          signal_source: metrics-storage
          platform: storage
          component: ingest
    scrape_timeout: 10s

  - job_name: vminsert-b
    static_configs:
      - targets: ['127.0.0.1:8488']
        labels:
          plane: cloud
          signal_source: metrics-storage
          platform: storage
          component: ingest
          replica: b
    scrape_timeout: 10s

  - job_name: vmselect
    static_configs:
      - targets: ['127.0.0.1:8485']
        labels:
          plane: cloud
          signal_source: metrics-storage
          platform: storage
          component: query
    scrape_timeout: 10s

  - job_name: vmselect-b
    static_configs:
      - targets: ['127.0.0.1:8489']
        labels:
          plane: cloud
          signal_source: metrics-storage
          platform: storage
          component: query
          replica: b
    scrape_timeout: 10s
