[Service]
# Keep the last config whose digest is present in the capability manifest when
# a newly rendered candidate belongs to an unverified release.
ExecStartPre=
ExecStartPre=/usr/local/sbin/rdstudio-otel-render-config
ExecStartPre=/opt/node-v22.16.0-linux-x64/bin/node --preserve-symlinks-main /opt/rdstudio-web-opt/current/ops/otel-collector/scope-isolation-capability-v1.mjs --config /var/lib/rdstudio-otel-collector/config.yaml --collector-bin /usr/local/bin/rdstudio-otelcol --attest ${STUDIO_OTEL_SCOPE_ISOLATION_ATTESTATION_FILE}
